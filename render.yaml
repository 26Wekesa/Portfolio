services:
  - type: web
    name: chris-tech-solutions
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn portfolio_site.wsgi:application --bind 0.0.0.0:$PORT
    initialDeployHook: python manage.py createsuperuser --noinput
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: chris-tech-solutions
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: chris-tech-solutions-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: portfolio-admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: wekesachristopher@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true

databases:
  - name: chris-tech-solutions-db
    databaseName: portfolio
    user: portfolio_user
    plan: free
    region: frankfurt
